# 安装：sudo cp deploy/nginx-quant-monitor.conf /etc/nginx/sites-available/quant-monitor
# 启用：sudo ln -sf /etc/nginx/sites-available/quant-monitor /etc/nginx/sites-enabled/
# 测试：sudo nginx -t && sudo systemctl reload nginx
#
# 将 your.domain.com 换成你的域名；仅用 IP 访问可把 server_name 改为 _

server {
    listen 80;
    server_name your.domain.com;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# HTTPS（推荐）：安装 certbot 后执行
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your.domain.com
